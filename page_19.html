<!doctype html>
<html lang="en">

<head>
  <!--
      ============================================
      Codemy.com — Bootstrap 5 For Everyone
      Lesson 19 — Pagination
      Instructor: John Elder
      Student: Jose “Joe” Ruiz

      TEACHING NOTES:

      • Pagination is used to navigate between pages of content.

      • Bootstrap 5 pagination uses:
            <ul class="pagination"> ... </ul>

      • Common classes:
            .page-item   → wrapper for each button
            .page-link   → the clickable link
            .active      → highlights current page
            .disabled    → disables a button

      • Sizing options:
            .pagination-lg
            .pagination-sm

      • Icons:
            &laquo;  → «  (previous)
            &raquo;  → »  (next)

      • No JavaScript required — pagination is purely visual unless paired with backend logic.

      ============================================
    -->

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>Lesson 19 - Pagination</title>
</head>

<body>

  <!-- ============================================
       NAVBAR
       ============================================ -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

      <a class="navbar-brand" href="#">Bootstrap 5 For Everyone</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#">About Me</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>

        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

      </div>
    </div>
  </nav>

  <!-- ============================================
       LESSON TITLE
       ============================================ -->
  <h1 class="text-center mt-5">Lesson 19 - Pagination</h1>

  <div class="container mt-4">

    <!-- ============================================
         BASIC PAGINATION
         Notes:
         • Simple previous/next with numbered pages.
         • .page-item + .page-link are required.
         ============================================ -->
    <nav aria-label="Basic pagination example" class="mb-5">
      <ul class="pagination">
        <li class="page-item"><a class="page-link" href="#">Previous</a></li>
        <li class="page-item"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
        <li class="page-item"><a class="page-link" href="#">Next</a></li>
      </ul>
    </nav>

    <!-- ============================================
         PAGINATION WITH ICONS
         Notes:
         • &laquo; and &raquo; create « and » arrows.
         • aria-label improves accessibility.
         ============================================ -->
    <nav aria-label="Pagination with icons" class="mb-5">
      <ul class="pagination">
        <li class="page-item">
          <a class="page-link" href="#" aria-label="Previous">
            <span aria-hidden="true">&laquo;</span>
          </a>
        </li>
        <li class="page-item"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
        <li class="page-item">
          <a class="page-link" href="#" aria-label="Next">
            <span aria-hidden="true">&raquo;</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- ============================================
         LARGE PAGINATION
         Notes:
         • .pagination-lg increases button size.
         • .active marks the current page.
         ============================================ -->
    <nav aria-label="Large pagination example">
      <ul class="pagination pagination-lg">
        <li class="page-item active">
          <a class="page-link" aria-current="page">1</a>
        </li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
      </ul>
    </nav>

  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
