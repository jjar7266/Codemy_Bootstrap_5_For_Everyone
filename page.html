<!doctype html>
<html lang="en">
  <head>
    <!--
      ============================================
      Codemy.com — Bootstrap 5 For Everyone
      Lesson 01 — Starter Template
      Instructor: John Elder
      Student: Jose “Joe” Ruiz
      Notes:
      - This lesson replaces the Bootstrap 4 starter template shown in the course.
      - Bootstrap 5 uses modern JavaScript and removes jQuery entirely.
      - All lessons in this archive will use Bootstrap 5 CDN links.
      - This file is intentionally simple — just verifying that Bootstrap loads correctly.
      ============================================
    -->

    <!-- Required meta tags for proper character encoding and mobile responsiveness -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--
      Bootstrap 5 CSS via CDN
      Using the CDN keeps the project clean and avoids local installations.
      This is the official Bootstrap 5.3.3 stylesheet.
    -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <title>Lesson 01 — Starter Template</title>
  </head>
  <body>

    <!--
      Main Content
      This is just a placeholder to confirm Bootstrap is working.
      We'll replace this with real components starting in the next lessons.
    -->
    <h1 class="text-center mt-5">Hello, Bootstrap 5!</h1>

    <!--
      Bootstrap 5 JS Bundle (includes Popper)
      No jQuery needed — Bootstrap 5 removed that dependency.
      The bundle includes everything Bootstrap needs for interactive components.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
  </body>
</html>
