<!doctype html>
<html lang="en">

<head>
  <!--
      ============================================
      Codemy.com — Bootstrap 5 For Everyone
      Lesson 12 — Dropdowns
      Instructor: John Elder
      Student: Jose “Joe” Ruiz

      Notes:
      - Dropdowns allow users to choose from a list of actions or links.
      - Bootstrap 5 dropdowns require:
          * .dropdown or .btn-group wrapper
          * .dropdown-toggle with data-bs-toggle="dropdown"
          * .dropdown-menu containing <li><a> items
      - .dropdown-toggle-split creates a split-button dropdown.
      - Dropdowns can be aligned, sized, or placed inside navbars.
      - Bootstrap 5 no longer requires Popper.js manually — included in the bundle.
      ============================================
    -->

  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>Lesson 12 — Dropdowns</title>
</head>

<body>

  <!-- ============================================
       NAVBAR
       ============================================ -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

      <a class="navbar-brand" href="#">Bootstrap 5 For Everyone</a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#">About Me</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>

        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

      </div>
    </div>
  </nav>

  <!-- ============================================
       LESSON TITLE
       ============================================ -->
  <h1 class="text-center mt-5">Lesson 12 — Dropdowns</h1>

  <div class="container mt-4">

    <!-- ============================================
         SPLIT BUTTON DROPDOWN
         ============================================
         Teaching Notes:
         - .btn-group groups buttons together.
         - The first button is a normal action button.
         - The second button uses:
             * .dropdown-toggle
             * .dropdown-toggle-split
             * data-bs-toggle="dropdown"
         - .dropdown-menu contains the list of actions.
         - <hr class="dropdown-divider"> creates a separator.
       -->

    <div class="btn-group mb-4">
      <button type="button" class="btn btn-danger">Danger</button>
      <button type="button" class="btn btn-danger dropdown-toggle dropdown-toggle-split"
              data-bs-toggle="dropdown" aria-expanded="false">
        <span class="visually-hidden">Toggle Dropdown</span>
      </button>

      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="#">Action</a></li>
        <li><a class="dropdown-item" href="#">Another action</a></li>
        <li><a class="dropdown-item" href="#">Something else here</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="#">Separated link</a></li>
      </ul>
    </div>

    <hr>

    <!-- ============================================
         TRY IT YOURSELF CHALLENGE
         ============================================
         1. Create a primary-colored dropdown (btn-primary).
         2. Add a dropdown inside the navbar.
         3. Create a dropup using .dropup.
         4. Create a dropright or dropleft menu.
         5. Add icons to dropdown items using Bootstrap Icons.
       ============================================ -->

  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
