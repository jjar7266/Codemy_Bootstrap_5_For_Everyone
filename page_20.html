<!doctype html>
<html lang="en">

<head>
  <!--
      ============================================
      Codemy.com — Bootstrap 5 For Everyone
      Lesson 20 — Popovers
      Instructor: John Elder
      Student: Jose “Joe” Ruiz

      TEACHING NOTES:

      • Popovers are small overlay boxes that appear when clicking a button.
        They are commonly used for:
            - Extra information
            - Tips
            - UI hints
            - Explanations

      • Bootstrap 5 popovers DO NOT auto‑initialize.
        They MUST be activated with JavaScript.

      • Required attributes:
            data-bs-toggle="popover"
            data-bs-title="Popover title"
            data-bs-content="Popover body text"

      • Placement options:
            top, right, bottom, left

      • Custom popovers:
            data-bs-custom-class="custom-popover"

      • IMPORTANT:
        The initialization script MUST come AFTER the Bootstrap JS bundle.
        Otherwise popovers will not work.

      • NEW IN THIS LESSON:
        The four placement popovers now use:
            d-flex gap-3
        to create clean, even spacing between buttons.

      ============================================
    -->

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>Lesson 20 - Popovers</title>
</head>

<body>

  <!-- ============================================
       NAVBAR
       ============================================ -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

      <a class="navbar-brand" href="#">Bootstrap 5 For Everyone</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#">About Me</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>

        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

      </div>
    </div>
  </nav>

  <!-- ============================================
       LESSON TITLE
       ============================================ -->
  <h1 class="text-center mt-5">Lesson 20 - Popovers</h1>

  <div class="container mt-4">

    <!-- ============================================
         BASIC POPOVER
         Notes:
         • data-bs-title sets the popover title.
         • data-bs-content sets the popover body text.
         ============================================ -->
    <button type="button"
            class="btn btn-lg btn-danger mb-4"
            data-bs-toggle="popover"
            data-bs-title="Popover title"
            data-bs-content="And here’s some amazing content. It’s very engaging. Right?">
      Click to toggle popover
    </button>

    <!-- ============================================
         POPOVER PLACEMENTS (IMPROVED SPACING)
         Notes:
         • d-flex creates a horizontal layout.
         • gap-3 adds clean spacing between buttons.
         • data-bs-container="body" prevents overflow issues.
         ============================================ -->
    <div class="d-flex gap-3 mb-4">

      <button type="button" class="btn btn-secondary"
              data-bs-container="body"
              data-bs-toggle="popover"
              data-bs-placement="top"
              data-bs-content="Top popover">
        Popover on top
      </button>

      <button type="button" class="btn btn-secondary"
              data-bs-container="body"
              data-bs-toggle="popover"
              data-bs-placement="right"
              data-bs-content="Right popover">
        Popover on right
      </button>

      <button type="button" class="btn btn-secondary"
              data-bs-container="body"
              data-bs-toggle="popover"
              data-bs-placement="bottom"
              data-bs-content="Bottom popover">
        Popover on bottom
      </button>

      <button type="button" class="btn btn-secondary"
              data-bs-container="body"
              data-bs-toggle="popover"
              data-bs-placement="left"
              data-bs-content="Left popover">
        Popover on left
      </button>

    </div>

    <!-- ============================================
         CUSTOM POPOVER
         Notes:
         • data-bs-custom-class allows custom styling.
         • You can define .custom-popover in your CSS.
         ============================================ -->
    <button type="button" class="btn btn-secondary"
            data-bs-toggle="popover"
            data-bs-placement="right"
            data-bs-custom-class="custom-popover"
            data-bs-title="Custom popover"
            data-bs-content="This popover is themed via CSS variables.">
      Custom popover
    </button>

  </div>

  <!-- ============================================
       BOOTSTRAP JS + REQUIRED POPOVER INITIALIZATION
       ============================================ -->

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Popover Initialization (MUST COME AFTER BOOTSTRAP JS) -->
  <script>
    // Select all elements that use data-bs-toggle="popover"
    const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]')

    // Convert NodeList to array and initialize each popover
    const popoverList = [...popoverTriggerList].map(el => new bootstrap.Popover(el))
  </script>

</body>

</html>
