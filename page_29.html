      TEACHING NOTES:

      WHAT SHADOW UTILITIES DO:
      • Add depth and elevation to elements.
      • Great for cards, images, and content blocks.
      • No custom CSS needed — all utility classes.

      SHADOW LEVELS:
      • shadow-none → remove shadow
      • shadow-sm   → small shadow
      • shadow      → regular shadow
      • shadow-lg   → large shadow

      REAL-WORLD USES:
      • Card components
      • Floating images
      • Emphasizing UI sections
      • Soft elevation in modern design

      ============================================
    -->
