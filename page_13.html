<!doctype html>
<html lang="en">

<head>
  <!--
      ============================================
      Codemy.com — Bootstrap 5 For Everyone
      Lesson 13 — Forms
      Instructor: John Elder
      Student: Jose “Joe” Ruiz

      Notes:
      - Bootstrap 5 provides a modern, clean form system using:
          * .form-label — labels for inputs
          * .form-control — text inputs, email, password, etc.
          * .form-text — helper text under inputs
          * .form-check — wrapper for checkboxes and radios
          * .form-check-input — checkbox/radio element
          * .form-check-label — label for checkbox/radio
      - Spacing utilities like .mb-3 help separate form groups.
      - Form components automatically style themselves for accessibility.
      - No jQuery required — Bootstrap 5 uses pure JS.
      ============================================
    -->

  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>Lesson 13 — Forms</title>
</head>

<body>

  <!-- ============================================
       NAVBAR
       ============================================ -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

      <a class="navbar-brand" href="#">Bootstrap 5 For Everyone</a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#">About Me</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>

        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

      </div>
    </div>
  </nav>

  <!-- ============================================
       LESSON TITLE
       ============================================ -->
  <h1 class="text-center mt-5">Lesson 13 — Forms</h1>

  <div class="container mt-4">

    <!-- ============================================
         BASIC FORM EXAMPLE
         ============================================
         Teaching Notes:
         - .mb-3 separates each form group.
         - Labels use .form-label for consistent spacing.
         - Inputs use .form-control for full-width styling.
         - Helper text uses .form-text for subtle, muted text.
         - Checkboxes use .form-check and .form-check-input.
         - Buttons use .btn classes for styling.
       -->

    <form>

      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Email address</label>
        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
        <div id="emailHelp" class="form-text">
          We'll never share your email with anyone else.
        </div>
      </div>

      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Password</label>
        <input type="password" class="form-control" id="exampleInputPassword1">
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">Check me out</label>
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>

    </form>

    <hr>

    <!-- ============================================
         TRY IT YOURSELF CHALLENGE
         ============================================
         1. Add a username field above the email field.
         2. Add a select dropdown using .form-select.
         3. Add a textarea using .form-control.
         4. Add a disabled input field.
         5. Add validation classes: .is-valid and .is-invalid.
       ============================================ -->

  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
