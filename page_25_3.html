      TEACHING NOTES:

      WHAT GRID NUMBERING MEANS:
      • Bootstrap’s grid is based on 12 units per row.
      • Numbered columns (e.g., .col-2, .col-4, .col-6) let you
        explicitly control how much width each column takes.
      • The numbers must add up to 12 (or less).

      WHY THIS MATTERS:
      • Gives you precise control over layout.
      • Lets you create sidebars, content areas, and custom widths.
      • Helps you design predictable, balanced layouts.

      EXAMPLES:
      • .col-2  → takes 2/12 of the row
      • .col-4  → takes 4/12 of the row
      • .col-6  → takes 6/12 of the row

      REAL‑WORLD USES:
      • Sidebars + main content
      • Product cards with fixed widths
      • Dashboard layouts
      • Form layouts with label/content ratios

      ============================================
    -->
