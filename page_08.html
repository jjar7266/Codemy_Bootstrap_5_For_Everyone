<!doctype html>
<html lang="en">

<head>
  <!--
      ============================================
      Codemy.com — Bootstrap 5 For Everyone
      Lesson 08 — Buttons
      Instructor: John Elder
      Student: Jose “Joe” Ruiz

      Notes:
      - Buttons use .btn + .btn-<context>.
      - Bootstrap 5 contextual classes:
          * primary, secondary, success, danger,
            warning, info, light, dark, link
      - Outline buttons use .btn-outline-<context>.
      - Block-level buttons use:
          * .d-grid for full-width
          * .gap-* for spacing
      - No more .btn-block (Bootstrap 4).
      ============================================
    -->

  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>Lesson 08 — Buttons</title>
</head>

<body>

  <!-- ============================================
       NAVBAR
       ============================================ -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

      <a class="navbar-brand" href="#">Bootstrap 5 For Everyone</a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#">About Me</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>

        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

      </div>
    </div>
  </nav>

  <!-- ============================================
       LESSON TITLE
       ============================================ -->
  <h1 class="text-center mt-5">Lesson 08 — Buttons</h1>

  <div class="container mt-4">

    <!-- ============================================
         CONTEXTUAL BUTTONS
         ============================================
         Teaching Notes:
         - .btn + .btn-<context> creates a styled button.
         - These are the most common UI elements.
       -->
    <h3>Contextual Buttons</h3>

    <button type="button" class="btn btn-primary">Primary</button>
    <button type="button" class="btn btn-secondary">Secondary</button>
    <button type="button" class="btn btn-success">Success</button>
    <button type="button" class="btn btn-danger">Danger</button>
    <button type="button" class="btn btn-warning">Warning</button>
    <button type="button" class="btn btn-info">Info</button>
    <button type="button" class="btn btn-light">Light</button>
    <button type="button" class="btn btn-dark">Dark</button>
    <button type="button" class="btn btn-link">Link</button>

    <hr>

    <!-- ============================================
         OUTLINE BUTTONS
         ============================================
         Teaching Notes:
         - Outline buttons are great for subtle UI.
         - Use .btn-outline-<context>.
       -->
    <h3>Outline Buttons</h3>

    <button type="button" class="btn btn-outline-primary">Primary</button>
    <button type="button" class="btn btn-outline-secondary">Secondary</button>
    <button type="button" class="btn btn-outline-success">Success</button>
    <button type="button" class="btn btn-outline-danger">Danger</button>
    <button type="button" class="btn btn-outline-warning">Warning</button>
    <button type="button" class="btn btn-outline-info">Info</button>
    <button type="button" class="btn btn-outline-light">Light</button>
    <button type="button" class="btn btn-outline-dark">Dark</button>

    <hr>

    <!-- ============================================
         BLOCK-LEVEL BUTTONS (Bootstrap 5)
         ============================================
         Teaching Notes:
         - Bootstrap 4 used .btn-block (removed).
         - Bootstrap 5 uses .d-grid for full-width.
         - .gap-* adds spacing between buttons.
       -->
    <h3>Block-Level Buttons</h3>

    <div class="d-grid gap-2">
      <button class="btn btn-primary" type="button">Full Width Button</button>
      <button class="btn btn-warning" type="button">Full Width Button</button>
    </div>

    <hr>

    <!-- ============================================
         TRY IT YOURSELF CHALLENGE
         ============================================
         1. Create a button group with three buttons.
         2. Add a large button using .btn-lg.
         3. Add a small button using .btn-sm.
         4. Create a full-width outline button.
       -->
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
