      TEACHING NOTES:

      WHAT BORDER UTILITIES DO:
      • Quickly add borders without writing CSS.
      • Control border width, color, and rounding.
      • Combine utilities for custom looks.

      BORDER WIDTHS:
      • border-1 → thinnest
      • border-2
      • border-3
      • border-4
      • border-5 → thickest

      BORDER COLORS:
      • border-primary   (blue)
      • border-danger    (red)
      • border-success   (green)
      • border-warning   (yellow)
      • border-info      (teal)
      • border-dark
      • border-light

      BORDER SHAPES:
      • rounded          → soft corners
      • rounded-circle   → perfect circle (square images only)
      • rounded-5        → extra rounded

      ============================================
    -->
