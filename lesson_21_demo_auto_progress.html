<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auto Progress Demo</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-5">

  <h2 class="mb-4">Auto-Filling Progress Bar Demo</h2>

  <!-- Progress Bar -->
  <div class="progress mb-4">
    <div id="demo-bar" class="progress-bar bg-success" style="width: 0%">0%</div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Auto Progress Script -->
  <script>
    /*
      This script automatically increases the width of the progress bar
      from 0% to 100%. It demonstrates how JavaScript can dynamically
      update Bootstrap components.
    */

    let progress = 0;
    const bar = document.getElementById("demo-bar");

    const interval = setInterval(() => {
      progress++;
      bar.style.width = progress + "%";
      bar.innerText = progress + "%";

      if (progress >= 100) {
        clearInterval(interval);
      }
    }, 50); // updates every 50ms
  </script>

</body>
</html>
