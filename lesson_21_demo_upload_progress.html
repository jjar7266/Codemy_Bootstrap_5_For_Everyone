<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Upload Progress Demo</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-5">

  <h2 class="mb-4">Fake File Upload Simulation</h2>

  <!-- Progress Bar -->
  <div class="progress mb-3">
    <div id="upload-bar"
         class="progress-bar progress-bar-striped progress-bar-animated bg-warning"
         style="width: 0%">0%</div>
  </div>

  <!-- Button -->
  <button id="upload-btn" class="btn btn-warning">Start Upload</button>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Upload Simulation Script -->
  <script>
    /*
      This script simulates a file upload by increasing the progress bar
      every 200ms. When it reaches 100%, the animation stops and the
      button text changes to "Upload Complete".
    */

    const bar = document.getElementById("upload-bar");
    const btn = document.getElementById("upload-btn");

    btn.addEventListener("click", () => {
      let progress = 0;

      const upload = setInterval(() => {
        progress += 5;
        bar.style.width = progress + "%";
        bar.innerText = progress + "%";

        if (progress >= 100) {
          clearInterval(upload);
          bar.classList.remove("progress-bar-animated");
          btn.innerText = "Upload Complete";
        }
      }, 200);
    });
  </script>

</body>
</html>
