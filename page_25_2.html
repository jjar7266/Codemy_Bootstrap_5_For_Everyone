      TEACHING NOTES:

      WHAT “LETTER SIZES” MEAN:
      • Bootstrap uses breakpoint prefixes: sm, md, lg, xl, xxl
      • These define when a column layout should “kick in”
      • Example: .col-sm means:
          → Full width on extra-small screens
          → Becomes a grid at the “sm” breakpoint (≥ 576px)

      WHY THIS MATTERS:
      • Lets you control layout at different screen sizes
      • Helps you design mobile‑first responsive pages
      • Ensures columns stack on phones but align on desktops

      BREAKPOINTS (Bootstrap 5):
      • xs  → <576px (no prefix)
      • sm  → ≥576px
      • md  → ≥768px
      • lg  → ≥992px
      • xl  → ≥1200px
      • xxl → ≥1400px

      REAL‑WORLD USES:
      • Mobile‑first layouts
      • Product grids that change at tablet size
      • Responsive dashboards
      • Multi‑column forms

      ============================================
    -->
