<!doctype html>
<html lang="en">

<head>
  <!--
      ============================================
      Codemy.com — Bootstrap 5 For Everyone
      Lesson 10 — Carousel
      Instructor: John Elder
      Student: Jose “Joe” Ruiz

      Notes:
      - A carousel is a slideshow component for cycling through images or content.
      - Key parts of a Bootstrap 5 carousel:
          * .carousel — main wrapper
          * .carousel-inner — container for slides
          * .carousel-item — each individual slide
          * .active — marks the first visible slide
          * .carousel-indicators — navigation dots
          * .carousel-control-prev / .carousel-control-next — slide controls
      - Bootstrap 5 no longer auto‑slides by default.
      - To enable auto‑slide:
          * data-bs-ride="carousel"
          * data-bs-interval="3000" (or any ms value)
      - Images often need custom sizing; object-fit: cover helps maintain aspect ratio.
      - Carousels can contain images, text, captions, or even full layouts.
      ============================================
    -->

  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>Lesson 10 — Carousel</title>

  <style>
    /* Limit carousel width and center it */
    #carouselExample {
      max-width: 400px;
      margin: 0 auto;
    }

    /* Control image height and cropping */
    .carousel-inner img {
      height: 400px;
      object-fit: cover;
    }
  </style>

</head>

<body>

  <!-- ============================================
       NAVBAR
       ============================================ -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

      <a class="navbar-brand" href="#">Bootstrap 5 For Everyone</a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#">About Me</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>

        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

      </div>
    </div>
  </nav>

  <!-- ============================================
       LESSON TITLE
       ============================================ -->
  <h1 class="text-center mt-5">Lesson 10 — Carousel</h1>

  <div id="carouselExample" class="carousel slide"
       data-bs-ride="carousel"
       data-bs-interval="3000">

    <!-- Indicators -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2"></button>
    </div>

    <!-- Slides -->
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="flamingo_sunset.png" class="d-block w-100" alt="Slide 1">
      </div>
      <div class="carousel-item">
        <img src="logo.png" class="d-block w-100" alt="Slide 2">
      </div>
      <div class="carousel-item">
        <img src="blue_T.png" class="d-block w-100" alt="Slide 3">
      </div>
    </div>

    <!-- Controls -->
    <button class="carousel-control-prev" type="button"
            data-bs-target="#carouselExample"
            data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
      <span class="visually-hidden">Previous</span>
    </button>

    <button class="carousel-control-next" type="button"
            data-bs-target="#carouselExample"
            data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
      <span class="visually-hidden">Next</span>
    </button>

  </div>

  <hr>

  <!-- ============================================
       TRY IT YOURSELF CHALLENGE
       ============================================
       1. Add captions to each slide using .carousel-caption.
       2. Change the interval speed to 1 second.
       3. Add a fourth slide to the carousel.
       4. Convert the carousel to a fade transition using .carousel-fade.
       5. Wrap the carousel in a Bootstrap card for a framed look.
       ============================================ -->

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
