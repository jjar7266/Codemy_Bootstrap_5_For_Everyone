<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Click Progress Demo</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-5">

  <h2 class="mb-4">Click to Increase Progress Demo</h2>

  <!-- Progress Bar -->
  <div class="progress mb-3">
    <div id="click-bar" class="progress-bar bg-info" style="width: 0%">0%</div>
  </div>

  <!-- Button -->
  <button id="increase-btn" class="btn btn-primary">Increase Progress</button>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Click Progress Script -->
  <script>
    /*
      This script increases the progress bar by 10% each time the user
      clicks the button. It demonstrates event-driven UI updates.
    */

    let value = 0;
    const bar = document.getElementById("click-bar");
    const btn = document.getElementById("increase-btn");

    btn.addEventListener("click", () => {
      if (value < 100) {
        value += 10;
        bar.style.width = value + "%";
        bar.innerText = value + "%";
      }
    });
  </script>

</body>
</html>
